<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Login – Mining Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #141a22;
      --border: rgba(255, 255, 255, 0.08);
      --muted: #8b9cb3;
      --accent: #00e676;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #122033 0%, var(--bg) 55%);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #e8eef7;
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.75rem;
      border-radius: 14px;
      background: rgba(0, 230, 118, 0.12);
      display: grid;
      place-items: center;
      font-size: 1.5rem;
    }
    .login-brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }
    .login-brand p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .form-label {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .form-control {
      background: #0f141b;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
    }
    .form-control:focus {
      background: #0f141b;
      color: #fff;
      border-color: rgba(0, 230, 118, 0.45);
      box-shadow: 0 0 0 0.2rem rgba(0, 230, 118, 0.12);
    }
    .btn-login {
      width: 100%;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #00e676, #00c853);
      color: #0a1a12;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
    }
    .btn-login:hover {
      filter: brightness(1.05);
      color: #0a1a12;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">⛏️</div>
      <h1>Mining Dashboard</h1>
      <p>Bitte anmelden</p>
    </div>
    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Benutzername</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Passwort</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-login">Anmelden</button>
    </form>
  </div>
</body>
</html>
